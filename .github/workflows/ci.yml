name: CI Pipeline

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop, dev ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'

jobs:
  # Backend build and test
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: koinon
          POSTGRES_PASSWORD: koinon_test
          POSTGRES_DB: koinon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Check code formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=koinon_test;Username=koinon;Password=koinon_test"
        ConnectionStrings__Redis: "localhost:6379"

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Backend Tests
        path: '**/test-results.trx'
        reporter: dotnet-trx

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: backend-coverage
        path: '**/coverage.cobertura.xml'

  # Frontend build and test
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/web

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run type checking
      run: npm run typecheck

    - name: Run tests
      run: npm test -- --coverage

    - name: Build production bundle
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: src/web/dist

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage
        path: src/web/coverage

  # Migration safety check
  migration-check:
    name: Migration Safety Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      checks: write
      contents: read

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: koinon
          POSTGRES_PASSWORD: koinon_test
          POSTGRES_DB: koinon_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore

    - name: Install local EF Core tools
      run: dotnet tool restore

    - name: Check for new migrations
      id: check-migrations
      run: |
        set -e

        MIGRATIONS_DIR="src/Koinon.Infrastructure/Migrations"

        if [ ! -d "$MIGRATIONS_DIR" ]; then
          echo "migrations_found=false" >> $GITHUB_OUTPUT
          echo "Migrations directory not found"
          exit 0
        fi

        if git diff --name-only origin/main...HEAD -- "$MIGRATIONS_DIR/*.cs" | \
           grep -E "Migrations/[0-9]{14}_.*\.cs$" | \
           grep -v "\.Designer\.cs$" | \
           grep -v "ModelSnapshot\.cs$" > /tmp/new_migrations.txt; then

          if [ -s /tmp/new_migrations.txt ]; then
            echo "migrations_found=true" >> $GITHUB_OUTPUT
            echo "Found new migrations:"
            cat /tmp/new_migrations.txt
          else
            echo "migrations_found=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "migrations_found=false" >> $GITHUB_OUTPUT
        fi

    - name: Validate migrations can apply
      if: steps.check-migrations.outputs.migrations_found == 'true'
      run: |
        set -e

        echo "Restoring Infrastructure project..."
        dotnet restore src/Koinon.Infrastructure/Koinon.Infrastructure.csproj

        echo "Validating migrations can apply to database..."
        dotnet ef database update \
          --project src/Koinon.Infrastructure \
          --startup-project src/Koinon.Api \
          --verbose

        echo "All migrations validated successfully"

      env:
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=koinon_test;Username=koinon;Password=koinon_test"
        Jwt__Secret: "ci-test-jwt-secret-key-minimum-32-characters-long"
        Jwt__Issuer: "koinon-ci-test"
        Jwt__Audience: "koinon-ci-test"

    - name: Check for destructive changes
      if: steps.check-migrations.outputs.migrations_found == 'true'
      run: |
        set -e

        MIGRATIONS_DIR="src/Koinon.Infrastructure/Migrations"
        TEMP_FILE="/tmp/destructive_check.txt"
        UP_METHODS_FILE="/tmp/up_methods.txt"

        echo "Checking for destructive database changes in Up() methods..."

        DESTRUCTIVE_PATTERNS=(
          "DropTable"
          "DropColumn"
          "DropIndex"
          "DropConstraint"
          "DropForeignKey"
          "DropPrimaryKey"
          "DropUnique"
          "RenameTable"
          "RenameColumn"
        )

        DESTRUCTIVE_FOUND=false

        NEW_MIGRATIONS=$(git diff --name-only origin/main...HEAD -- "$MIGRATIONS_DIR/*.cs" | \
          grep -E "Migrations/[0-9]{14}_.*\.cs$" | \
          grep -v "\.Designer\.cs$" | \
          grep -v "ModelSnapshot\.cs$" || true)

        if [ -z "$NEW_MIGRATIONS" ]; then
          echo "No new migration files to check"
          exit 0
        fi

        > "$UP_METHODS_FILE"
        for migration in $NEW_MIGRATIONS; do
          if [ -f "$migration" ]; then
            # Explicit, reviewed escape hatch: a migration may declare its
            # destructive operations intentional with a justification comment.
            if grep -q "DESTRUCTIVE-CHANGE-APPROVED:" "$migration"; then
              echo "Skipping (explicitly approved destructive change): $migration"
              grep "DESTRUCTIVE-CHANGE-APPROVED:" "$migration"
              continue
            fi
            echo "Checking: $migration"
            awk '/protected override void Up\(/,/protected override void Down\(/' "$migration" | \
              head -n -1 >> "$UP_METHODS_FILE"
          fi
        done

        for pattern in "${DESTRUCTIVE_PATTERNS[@]}"; do
          if grep -n "migrationBuilder\.$pattern" "$UP_METHODS_FILE" > "$TEMP_FILE" 2>/dev/null; then
            if [ -s "$TEMP_FILE" ]; then
              echo ""
              echo "WARNING: Potentially destructive operation detected in Up(): $pattern"
              echo "Location:"
              cat "$TEMP_FILE"
              echo ""
              DESTRUCTIVE_FOUND=true
            fi
          fi
        done

        if [ "$DESTRUCTIVE_FOUND" = true ]; then
          echo "DESTRUCTIVE MIGRATION DETECTED"
          echo ""
          echo "This migration's Up() method contains operations that may result in data loss."
          echo "Please review and confirm this is intentional."
          exit 1
        else
          echo "No destructive changes detected in Up() methods"
        fi

        rm -f "$TEMP_FILE" "$UP_METHODS_FILE"

  # Integration smoke test
  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: koinon
          POSTGRES_PASSWORD: koinon
          POSTGRES_DB: koinon
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Restore and build API
      run: |
        dotnet restore
        dotnet build --no-restore --configuration Release

    - name: Apply database migrations
      run: |
        echo "Applying EF Core migrations..."
        dotnet tool restore
        dotnet ef database update \
          --project src/Koinon.Infrastructure \
          --startup-project src/Koinon.Api \
          --configuration Release
      env:
        ASPNETCORE_ENVIRONMENT: "Production"
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=koinon;Username=koinon;Password=koinon"
        Jwt__Secret: "ci-integration-test-jwt-key-minimum-32-chars-long-for-security"
        Jwt__Issuer: "koinon-ci-integration"
        Jwt__Audience: "koinon-ci-integration"

    - name: Start API in background
      run: |
        dotnet run --project src/Koinon.Api --no-build --configuration Release &
        echo $! > /tmp/api.pid
        echo "API started with PID $(cat /tmp/api.pid)"
        sleep 5
      env:
        ASPNETCORE_URLS: "http://0.0.0.0:5000"
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=koinon;Username=koinon;Password=koinon"
        ConnectionStrings__Redis: "localhost:6379"
        Jwt__Secret: "ci-integration-test-jwt-key-minimum-32-chars-long-for-security"
        Jwt__Issuer: "koinon-ci-integration"
        Jwt__Audience: "koinon-ci-integration"

    - name: Wait for API to be ready
      run: |
        echo "Waiting for API to respond on http://localhost:5000/health..."
        timeout 120 bash -c 'until curl -sf http://localhost:5000/health > /dev/null 2>&1; do
          echo "Waiting for API... (checking health endpoint)"
          sleep 3
        done'
        echo "API is ready!"

    - name: Check API health endpoint
      run: |
        echo "Fetching health check status..."
        HEALTH_RESPONSE=$(curl -s http://localhost:5000/health)
        echo "Health response: $HEALTH_RESPONSE"

        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
        echo "HTTP Status: $HTTP_STATUS"

        if [ "$HTTP_STATUS" != "200" ]; then
          echo "Health check failed with status $HTTP_STATUS"
          exit 1
        fi

        echo "API health check passed"

    - name: Cleanup
      if: always()
      run: |
        if [ -f /tmp/api.pid ]; then
          kill $(cat /tmp/api.pid) 2>/dev/null || true
        fi

  # Work unit validation
  work-unit-validation:
    name: Work Unit Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check work-units.json is updated
      run: |
        if [ -f .claude/work-units.json ]; then
          echo "Work units tracker exists"
          cat .claude/work-units.json
        else
          echo "Work units tracker not found - creating empty tracker"
          mkdir -p .claude
          echo '{"completed":[],"in_progress":null,"blocked":[]}' > .claude/work-units.json
        fi

    - name: Validate JSON format
      run: |
        if [ -f .claude/work-units.json ]; then
          python3 -m json.tool .claude/work-units.json > /dev/null
          echo "work-units.json is valid JSON"
        fi

  # Architecture graph baseline drift check
  graph-validation:
    name: Graph Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install root dependencies
      run: npm ci

    - name: Install frontend dependencies
      run: npm ci
      working-directory: src/web

    - name: Regenerate graph baseline
      run: npm run graph:update

    - name: Verify contracts
      run: npm run graph:verify

    - name: Check for graph drift
      run: node scripts/graph-drift.mjs

  # Verify that local architect/code-review evidence landed with the PR.
  # GitHub-hosted CI does not call private model/RAG endpoints; it only checks
  # the structured, signed artifact against the exact PR diff.
  architecture-review-artifact:
    name: Architecture Review Artifact
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install root dependencies
      run: npm ci

    - name: Verify signed architecture review artifact
      run: >
        node scripts/architecture/verify-review-artifact.mjs
        --base ${{ github.event.pull_request.base.sha }}
        --head ${{ github.event.pull_request.head.sha }}
        --reviews docs/architecture/reviews
        --signers docs/architecture/signers/trusted-agent-signers.json

  # koinon-dev MCP server: committed dist/ must match src/
  mcp-dist-drift:
    name: MCP Server Dist Drift
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Rebuild koinon-dev MCP server
      run: npm --prefix tools/mcp-koinon-dev ci && npm --prefix tools/mcp-koinon-dev run build

    - name: Check committed dist/ matches source
      run: |
        if ! git diff --exit-code tools/mcp-koinon-dev/dist; then
          echo "::error::tools/mcp-koinon-dev/dist is stale. Run 'npm run mcp:build' and commit the result."
          exit 1
        fi
        echo "Committed dist/ is up to date"

    - name: Smoke-test get_impact_analysis against committed baseline
      run: npm --prefix tools/mcp-koinon-dev test

  # Browser smoke tests against the full containerized stack.
  # This is the gate that catches check-in kiosk regressions (the MVP).
  e2e-smoke:
    name: E2E Smoke (Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start full stack
      run: docker compose -f docker-compose.full.yml up -d --build

    - name: Wait for API and web health
      run: |
        timeout 300 bash -c 'until curl -sf http://localhost:5000/health > /dev/null; do sleep 5; done'
        timeout 60 bash -c 'until curl -sf http://localhost:3000/health > /dev/null; do sleep 3; done'
        echo "Stack is healthy"

    - name: Seed demo data
      run: |
        docker run --rm -v "$PWD:/repo" -w /repo --network koinon_network \
          mcr.microsoft.com/dotnet/sdk:10.0-alpine \
          dotnet run --project tools/Koinon.TestDataSeeder -- seed \
          --connection "Host=postgres;Port=5432;Database=koinon;Username=koinon;Password=koinon"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json

    - name: Install frontend dependencies
      run: npm ci
      working-directory: src/web

    - name: Install Playwright chromium
      run: npx playwright install --with-deps chromium
      working-directory: src/web

    - name: Run smoke suite
      run: npx playwright test e2e/tests/smoke.spec.ts --project=chromium
      working-directory: src/web
      env:
        E2E_BASE_URL: http://localhost:3000

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-smoke-report
        path: src/web/playwright-report

    - name: Stack logs on failure
      if: failure()
      run: docker compose -f docker-compose.full.yml logs --tail 100

    - name: Teardown
      if: always()
      run: docker compose -f docker-compose.full.yml down -v

  # Windows canary: cross-platform development is a hard requirement.
  # Build + DB-free unit tests + frontend typecheck on windows-latest so
  # Windows breakage fails PRs mechanically. (DB/Testcontainers suites need
  # Linux containers and stay on the ubuntu jobs.)
  windows-canary:
    name: Windows Canary
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        global-json-file: global.json

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json

    - name: Build solution
      run: dotnet build --configuration Release

    - name: Run DB-free test suites
      run: >
        dotnet test tests/Koinon.Domain.Tests --no-build --configuration Release &&
        dotnet test tests/Koinon.Application.Tests --no-build --configuration Release &&
        dotnet test tests/Koinon.ArchitectureTests --no-build --configuration Release

    - name: Frontend typecheck
      run: npm ci; npm run typecheck
      working-directory: src/web

  # Summary job
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [backend, frontend, migration-check, integration, work-unit-validation, graph-validation, architecture-review-artifact, mcp-dist-drift, e2e-smoke, windows-canary]
    if: always()
    steps:
    - name: Check all jobs
      run: |
        if [[ "${{ needs.backend.result }}" == "success" ]] && \
           [[ "${{ needs.frontend.result }}" == "success" ]] && \
           [[ "${{ needs.migration-check.result }}" == "success" || "${{ needs.migration-check.result }}" == "skipped" ]] && \
           [[ "${{ needs.integration.result }}" == "success" ]] && \
           [[ "${{ needs.work-unit-validation.result }}" == "success" || "${{ needs.work-unit-validation.result }}" == "skipped" ]] && \
           [[ "${{ needs.graph-validation.result }}" == "success" ]] && \
           [[ "${{ needs.architecture-review-artifact.result }}" == "success" || "${{ needs.architecture-review-artifact.result }}" == "skipped" ]] && \
           [[ "${{ needs.mcp-dist-drift.result }}" == "success" ]] && \
           [[ "${{ needs.e2e-smoke.result }}" == "success" ]] && \
           [[ "${{ needs.windows-canary.result }}" == "success" ]]; then
          echo "All CI checks passed"
          exit 0
        else
          echo "One or more CI checks failed"
          exit 1
        fi
